<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <!-- Website Icon -->
    <link rel="icon" type="image/png" href="Images/site-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <title>Stop Killing Optical Media</title>
</head>

<body>

    <!-- Hidden Mini Game -->
    <div id="minigame">

        <div class="game-box">

            <button id="close-game">X</button>

            <h1>OPTICAL MEDIA DEFENSE</h1>

            <p>Save the discs!</p>

            <p>
                Discs Saved:
                <span id="score">0</span>
            </p>

            <div id="game-area"></div>

        </div>

    </div>


    <!-- Main Website Banner -->
    <div class="solid-banner">

        <img src="Images/Disc1.png" alt="">

        <span>Stop Killing Optical Media</span>

        <img src="Images/Disc2.png" alt="">

    </div>

    <div class="main-layout">

    <a href="xbox.html" class="console-button xbox-button">
        <img src="Images/Xbox.webp" alt="Xbox">
        <span>Xbox</span>
    </a>

    <div class="main-banner">
        Major game corporations want to leave physical media behind.
    </div>

    <a href="playstation.html" class="console-button playstation-button">
        <img src="Images/Playstation.jpg" alt="PlayStation">
        <span>PlayStation</span>
    </a>

    <a href="nintendo.html" class="console-button nintendo-button">
        <img src="Images/Nintendo.png" alt="Nintendo">
        <span>Nintendo</span>
    </a>

</div>

<a href="store.html" class="console-button store-button">
    🛒
    <span>STORE</span>
</a>

    <!-- Mobile Mini Game Button -->
    <button id="mobile-game-button" onclick="openMiniGame()">
        🎮 Mini Game
    </button>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
